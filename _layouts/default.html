<!doctype html>
<html lang="{{ site.lang | default: 'en' | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != 'Home' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav aria-label="Main navigation">
          {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label | escape }}</a>
          {% endfor %}
        </nav>
      </header>
      <main id="main-content" tabindex="-1">
        {{ content }}
      </main>
      <footer class="site-footer">
        <span>© {{ site.time | date: '%Y' }} {{ site.title | escape }}</span>
        {% if site.email and site.email != '' %}
        <a href="mailto:{{ site.email | escape }}">Contact</a>
        {% endif %}
      </footer>
    </div>
  </body>
</html>
